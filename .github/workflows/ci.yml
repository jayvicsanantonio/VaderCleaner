# Builds VaderCleaner, runs the unit-test suite, and lints on every push and PR.
# The project file is generated by XcodeGen, so CI regenerates it rather than
# trusting the checked-in .xcodeproj.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The app targets macOS 26, so it needs an Xcode 26 runner image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Signing is unavailable on CI, and sign-dev.sh's app-seal step breaks the
      # test bundle format, so it is skipped via the sentinel identity.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project VaderCleaner.xcodeproj \
            -scheme VaderCleaner \
            -destination 'platform=macOS' \
            -only-testing:VaderCleanerTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="skip-dev-seal" \
            | xcpretty && exit ${PIPESTATUS[0]}

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      # Not --strict: warnings are advisory during adoption, `error`-level
      # violations (force casts, force tries, print calls) fail the build.
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging
