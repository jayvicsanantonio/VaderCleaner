# Builds VaderCleaner, runs the unit-test suite, and lints on every push and PR.
# The project file is generated by XcodeGen, so CI regenerates it rather than
# trusting the checked-in .xcodeproj.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The app targets macOS 26, so it needs an Xcode 26 runner image.
    runs-on: macos-26
    # The suite runs in ~25s and the whole job in ~2min. The cap exists because
    # the child-process tests can hang xcodebuild outright rather than fail —
    # without it GitHub's 6-hour default applies and a hang silently burns
    # runner time. See the test-timeout flags on the build step, which should
    # catch the hang first and name the test that caused it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Selects the newest Xcode the image actually carries rather than a
      # hardcoded path, and prints it: the app needs the macOS 26 SDK and a
      # Swift 6.2+ toolchain (for `isolated deinit`), so if a runner image
      # ever ships something older this log says so directly.
      - name: Select Xcode
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none beyond the default)"
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -switch "$latest"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Signing is unavailable on CI, and sign-dev.sh's app-seal step breaks the
      # test bundle format, so it is skipped via the sentinel identity.
      #
      # ClamAV staging is skipped too. Vendor/clamav is gitignored, and
      # Scripts/bundle-clamav.sh cannot currently restage it — it pins exact
      # dylib patch versions and Homebrew has moved past them (see the PR
      # discussion). This job compiles the app and runs the unit suite, which
      # injects fakes for the malware engine and never touches the real binary,
      # so the artifact it produces is a test artifact and not a shippable app.
      # Restoring real staging here depends on fixing that script first.
      - name: Build and test
        env:
          VADERCLEANER_SKIP_CLAMAV_STAGING: "1"
        run: |
          set -o pipefail
          # The whole suite runs in ~25s, so a 120s per-test allowance is far
          # above anything legitimate. It exists because the child-process
          # tests (DefaultBrewRunner, ProcessLineStreamer) can wedge xcodebuild
          # indefinitely instead of failing; with timeouts enabled that becomes
          # a normal failure naming the test, rather than a job that sits until
          # the runner is killed.
          xcodebuild test \
            -project VaderCleaner.xcodeproj \
            -scheme VaderCleaner \
            -destination 'platform=macOS' \
            -only-testing:VaderCleanerTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="skip-dev-seal" \
            | xcpretty && exit ${PIPESTATUS[0]}

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat

      # Not --strict: the config is calibrated so `error` means something is
      # actually wrong (force casts, force tries, print calls), while the
      # remaining warnings are advisory. Verified clean at error level.
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      # --lint, never a write: the rule set only strips whitespace nobody
      # chose, so any hit here is a stray trailing space or duplicate blank
      # line rather than a formatting opinion.
      - name: SwiftFormat
        run: swiftformat . --lint
