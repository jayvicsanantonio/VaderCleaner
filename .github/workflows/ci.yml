# Builds VaderCleaner, runs both unit-test suites, and lints on every push and PR.
# The project file is generated by XcodeGen, so CI regenerates it rather than
# trusting the checked-in .xcodeproj.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the app and runs the app-hosted suite: the few tests that need the
  # app around them. The rest of the unit tests are core-tests' job below.
  build-and-test:
    # The app targets macOS 26, so it needs an Xcode 26 runner image.
    runs-on: macos-26
    # The suite runs in seconds and the whole job in ~2min. The cap exists
    # because a hung test can wedge xcodebuild outright rather than fail —
    # without it GitHub's 6-hour default applies and a hang silently burns
    # runner time. See the test-timeout flags on the build step, which should
    # catch the hang first and name the test that caused it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Selects the newest Xcode the image actually carries rather than a
      # hardcoded path, and prints it: the app needs the macOS 26 SDK and a
      # Swift 6.2+ toolchain (for `isolated deinit`), so if a runner image
      # ever ships something older this log says so directly.
      - name: Select Xcode
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none beyond the default)"
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -switch "$latest"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Vendor/clamav is gitignored — 20 MB of Homebrew bottles with their
      # install names rewritten, which each developer stages once. The
      # `Stage bundled ClamAV` build phase fails without it by design, so CI
      # stages it the same way rather than being taught to skip. Cached on the
      # vendoring script's hash, so the download only repeats when the recipe
      # changes. The script pins the arm64_tahoe bottle, hence the arch echo.
      - name: Cache bundled ClamAV
        id: clamav
        uses: actions/cache@v4
        with:
          path: Vendor/clamav
          key: clamav-${{ runner.arch }}-${{ hashFiles('Scripts/bundle-clamav.sh') }}

      - name: Stage bundled ClamAV
        if: steps.clamav.outputs.cache-hit != 'true'
        run: |
          echo "runner arch: $(uname -m)"
          Scripts/bundle-clamav.sh

      - name: Generate project
        run: xcodegen generate

      # Signing is unavailable on CI, and sign-dev.sh's app-seal step breaks the
      # test bundle format, so it is skipped via the sentinel identity.
      - name: Build and test (app-hosted suite)
        run: |
          set -o pipefail
          # The timeouts bound any test that hangs, turning it into a failure
          # that names itself instead of a job that runs until the runner is
          # killed. The suite takes seconds, so a 120s per-test allowance is
          # far above anything legitimate.
          xcodebuild test \
            -project VaderCleaner.xcodeproj \
            -scheme VaderCleaner \
            -destination 'platform=macOS' \
            -only-testing:VaderCleanerTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="skip-dev-seal" \
            | xcpretty && exit ${PIPESTATUS[0]}

  # The UI-free core is the VaderCleanerCore Swift package, and most of the
  # unit tests run against it hostless under `swift test`: no XcodeGen, no
  # ClamAV staging, no app build or launch. Its own job, so it runs alongside
  # build-and-test and a failure in either reports on its own.
  core-tests:
    runs-on: macos-26
    # `swift test` has no per-test timeout flags, so this cap is what bounds a
    # hung test. The suite takes ~10s and the job a couple of minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The package needs the same macOS 26 SDK and Swift 6.2+ toolchain as the
      # app; see build-and-test's step of the same name.
      - name: Select Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -switch "$latest"
          fi
          swift --version

      - name: Test VaderCleanerCore
        run: |
          # DefaultBrewRunner and ProcessLineStreamer are skipped: they spawn
          # child processes and can wedge the whole test process at teardown
          # — a leaked grandchild holding the stdout pipe's write end keeps
          # the test process alive — rather than failing. One run sat for 37
          # minutes before being cancelled.
          #
          # This gives up the only coverage of subprocess cancellation and
          # pipe-EOF handling, which is the code whose real failure mode is a
          # scan that never returns. The suites still run locally
          # (`swift test --package-path VaderCleanerCore` with no --skip), so
          # the coverage is deferred to a developer machine, not deleted.
          swift test --package-path VaderCleanerCore \
            --skip DefaultBrewRunnerTests \
            --skip ProcessLineStreamerTests

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat

      # Not --strict: the config is calibrated so `error` means something is
      # actually wrong (force casts, force tries, print calls), while the
      # remaining warnings are advisory. Verified clean at error level.
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      # --lint, never a write: the rule set only strips whitespace nobody
      # chose, so any hit here is a stray trailing space or duplicate blank
      # line rather than a formatting opinion.
      - name: SwiftFormat
        run: swiftformat . --lint
