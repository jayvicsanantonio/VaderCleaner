# SwiftLint overrides for the unit-test target.
#
# Test code is held to the same correctness bar as the app but not the same
# defensive one: a force unwrap that traps is a legitimate way for a test to
# fail, and `var tempRoot: URL!` set up in `setUpWithError` is the standard
# XCTest fixture idiom. Enforcing the app's rules here produced ~180 violations
# that all described correct, conventional test code.

disabled_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - force_cast
  - identifier_name
  - trailing_comma
  - implicit_optional_initialization
  - empty_count
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - todo
