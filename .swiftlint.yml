# SwiftLint configuration for VaderCleaner.
# Thresholds are tuned to the code that exists today: rules the codebase already
# satisfies are errors (so they stay true), and size limits sit above current
# maxima so adopting the linter produces no busywork. CI runs without --strict,
# so warnings are advisory and only `error` violations fail the build.

included:
  - VaderCleaner
  - VaderCleanerTests
  - VaderCleanerUITests
  - VaderCleanerHelper
  - Shared

excluded:
  - .build
  - DerivedData
  - Vendor
  - .claude/worktrees
  - Scripts

# ── Rules the codebase already holds to; kept as errors so they stay true ──
# Verified at adoption: 0 force casts, 0 force tries, 0 `print(` calls.
analyzer_rules:
  - unused_import

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  # SwiftUI view bodies legitimately nest deeply and take many parameters.
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  # The codebase documents intent in long single-line file headers by convention.
  - todo

force_cast:
  severity: error

force_try:
  severity: error

# One known violation at adoption (CleanupManagerModel.swift:382, a dictionary
# lookup keyed from that dictionary's own `keys`), so this warns rather than fails.
force_unwrapping:
  severity: warning

line_length:
  warning: 140
  error: 250
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
  ignores_function_declarations: true

file_length:
  warning: 800
  error: 2000
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 1500

function_body_length:
  warning: 60
  error: 200

cyclomatic_complexity:
  warning: 12
  error: 25

nesting:
  type_level: 2

identifier_name:
  min_length:
    warning: 2
    error: 1
  # Domain-standard short names used throughout the scanners and views.
  allowed_symbols: ["_"]
  excluded:
    - a
    - b
    - i
    - j
    - n
    - x
    - y
    - id
    - up
    - to
    - db
    - os

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

large_tuple:
  warning: 3
  error: 4

custom_rules:
  no_print:
    name: "No print()"
    regex: '(^|[^a-zA-Z0-9_.])print\('
    message: "Use os.Logger with a privacy annotation instead of print()."
    severity: error
    match_kinds:
      - identifier

  logger_privacy_annotation:
    name: "Logger interpolation needs a privacy annotation"
    regex: 'log\.(error|info|debug|notice|fault|warning)\("[^"]*\\\([^)]*\)(?![^"]*privacy:)'
    message: "Interpolated log values must declare privacy: .public or .private — errors and paths can carry user data."
    severity: warning
