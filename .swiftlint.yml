# SwiftLint configuration for VaderCleaner.
#
# Tuned against a real run over the whole repo, not against defaults. Rules that
# fought this codebase's deliberate conventions — or that misread its value types
# — are off, with the reason recorded, so the violations that remain are signal.
# CI runs without --strict, so warnings are advisory and only `error` fails.

included:
  - VaderCleaner
  - VaderCleanerTests
  - VaderCleanerUITests
  - VaderCleanerHelper
  - Shared

excluded:
  - .build
  - DerivedData
  - Vendor
  - .claude
  - Scripts

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_string
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  # SwiftUI view bodies legitimately nest deeply and take many parameters.
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - todo

  # `empty_count` is unsound here. It is lexical, and this codebase models
  # several summaries as value types carrying a plain `count: Int`
  # (`ManagerSelectionSummary`, the `(count:bytes:)` tuples in My Clutter and
  # Space Lens). Every one of its 7 hits was such a type, where `isEmpty` does
  # not exist — applying them would not compile.
  - empty_count

  # The codebase consistently uses trailing commas in multi-line literals; the
  # default rule wants them removed. 125 hits, all deliberate style.
  - trailing_comma

  # `var detail: String? = nil` is the house style — the explicit `nil` is kept
  # for symmetry with the initialisers around it. 35 hits, all deliberate.
  - implicit_optional_initialization

  # `redundant_nil_coalescing` is unsound on the double-optional flattening this
  # codebase uses deliberately. `row.map { … ? $0 : nil }` is `Int??`, and the
  # `?? nil` collapses it to the `Int?` the property needs; the same applies to
  # `scanScope?.scanRoots ?? nil`. Its autocorrect removes the operator and
  # leaves a nested optional, changing the type.
  - redundant_nil_coalescing

  # SwiftLint wants `nonisolated private static`; the codebase consistently
  # writes `private nonisolated static`, leading with the access level. Both are
  # valid and the house order is already uniform, so enforcing the rule would be
  # churn across 20 declarations for no gain.
  - modifier_order

  # This rule prefers the failable `String(data:encoding:)` so invalid bytes
  # surface as nil. Every Data→String site here wants the opposite: brew's
  # stdout, a sysctl brand string, and an SMC key are decoded totally, because
  # one malformed byte should degrade a character rather than discard the whole
  # reading. `String(decoding:as:)` is the deliberate choice at all four sites.
  - optional_data_string_conversion

force_cast:
  severity: error

force_try:
  severity: error

force_unwrapping:
  severity: warning

implicitly_unwrapped_optional:
  severity: warning

# Long lines here are almost entirely user-facing copy inside `Text(...)` and
# Foundation Models `@Guide` prompt strings, which read worse wrapped than long.
# `ignores_comments` handles the doc headers; the threshold accommodates the
# copy. Only genuinely runaway lines fail.
line_length:
  warning: 200
  error: 500
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
  ignores_function_declarations: true

file_length:
  warning: 900
  error: 2000
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 1500

# `SectionPresentation.for(_:)` is a 208-line declarative catalog — one case per
# section — which is clearer whole than split. The error threshold clears it.
function_body_length:
  warning: 60
  error: 250

cyclomatic_complexity:
  warning: 12
  error: 25

nesting:
  type_level: 2

identifier_name:
  min_length:
    warning: 2
    error: 1
  allowed_symbols: ["_"]
  # Single letters are the domain vocabulary in the geometry and colour code —
  # radius, time, luminance, chroma, and the point/basis/coefficient names in
  # `SpaceLensBubbleLayout`'s smallest-enclosing-circle solver, where `A`, `B`,
  # and `C` are the quadratic's coefficients as they appear in the maths.
  excluded:
    - a
    - b
    - c
    - d
    - e
    - f
    - g
    - h
    - i
    - j
    - k
    - l
    - m
    - n
    - o
    - p
    - q
    - r
    - s
    - t
    - u
    - v
    - w
    - x
    - y
    - z
    - A
    - B
    - C
    - D
    - P
    - R
    - id
    - up
    - to
    - db
    - os

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

# `SMCReader` mirrors IOKit's C structs, whose fixed-size byte tuples run to
# 32 members. The threshold is for Swift-authored tuples, not those.
large_tuple:
  warning: 4
  error: 40

custom_rules:
  no_print:
    name: "No print()"
    regex: '(^|[^a-zA-Z0-9_.])print\('
    message: "Use os.Logger with a privacy annotation instead of print()."
    severity: error
    match_kinds:
      - identifier
